<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | WaitList VIP</title><style>body{font:16px system-ui;background:#08111f;color:#eef4ff;margin:0;padding:28px;max-width:1000px;margin:auto}h1{color:#61d4ff}.card,.entry{background:#101d31;padding:18px;border-radius:14px;margin:14px 0}input,button{padding:11px;border-radius:9px;border:1px solid #38516f;font:inherit}button{cursor:pointer;background:#61d4ff;color:#08111f;font-weight:700}.danger{background:#ff7b8a}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#152b46;padding:14px;border-radius:10px;min-width:100px}.entry{display:flex;justify-content:space-between;align-items:center;gap:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.hidden{display:none}</style></head><body><h1>Panel de administración</h1><section id="login" class="card"><p>Ingresa la contraseña de administrador.</p><input id="password" type="password" placeholder="Contraseña"><button id="enter">Entrar</button><p id="error"></p></section><main id="app" class="hidden"><section id="stats" class="stats"></section><section id="entries"></section></main><script>const login=document.querySelector('#login'),app=document.querySelector('#app'),err=document.querySelector('#error');async function load(){const r=await fetch('/api/admin/queue');if(!r.ok)return;const d=await r.json();stats.innerHTML=Object.entries({En espera:d.stats.waiting,Atendiendo:d.stats.serving,Completados:d.stats.completed,'Espera promedio':d.stats.averageWaitMinutes+' min'}).map(([k,v])=>`<div class="stat"><b>${v}</b><br>${k}</div>`).join('');entries.innerHTML=d.entries.slice().reverse().map(e=>`<article class="entry"><div><b>${e.name}</b> · ${e.partySize} persona(s)<br><small>${e.phone||'sin teléfono'} · ${e.status}</small></div><div class="actions">${e.status==='waiting'?`<button onclick="changeStatus('${e.id}','serving')">Atendiendo</button>`:''}${e.status!=='completed'?`<button onclick="changeStatus('${e.id}','completed')">Completar</button>`:''}<button class="danger" onclick="removeEntry('${e.id}')">Eliminar</button></div></article>`).join('')||'<p>Aún no hay clientes.</p>'}async function changeStatus(id,status){await fetch('/api/admin/entry/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}async function removeEntry(id){if(confirm('¿Eliminar este registro?')){await fetch('/api/admin/entry/'+id,{method:'DELETE'});load()}}enter.onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(!r.ok){err.textContent='Contraseña incorrecta.';return}login.classList.add('hidden');app.classList.remove('hidden');load();setInterval(load,3000)};</script></body></html>
