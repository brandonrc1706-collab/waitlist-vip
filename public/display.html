<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantalla | WaitList VIP</title><style>body{font-family:system-ui;background:#08111f;color:#eef4ff;margin:0;padding:6vw;text-align:center}h1{font-size:clamp(2rem,6vw,5rem);color:#61d4ff;margin:0}.now{font-size:clamp(2rem,7vw,7rem);padding:5vw;background:#101d31;border-radius:28px;margin:4vw 0}.waiting{font-size:clamp(1.3rem,3vw,3rem);line-height:1.7;color:#b8c8df}</style></head><body><h1>WaitList VIP</h1><p>Atendiendo ahora</p><div id="now" class="now">Esperando clientes</div><div><p>En espera</p><div id="waiting" class="waiting">—</div></div><script>async function load(){const r=await fetch('/api/queue'),d=await r.json(),s=d.entries.filter(e=>e.status==='serving'),w=d.entries.filter(e=>e.status==='waiting');now.textContent=s.length?s.map(e=>e.name).join(' · '):'Esperando clientes';waiting.textContent=w.length?w.map((e,i)=>`${i+1}. ${e.name}`).join('  ·  '):'No hay nadie en espera';}load();setInterval(load,3000);</script></body></html>
