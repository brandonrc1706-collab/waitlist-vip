<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaitList VIP</title><style>body{font:16px system-ui;background:#08111f;color:#eef4ff;margin:0;display:grid;place-items:center;min-height:100vh}.card{width:min(420px,90vw);background:#101d31;padding:32px;border-radius:22px;box-shadow:0 20px 70px #0008}h1{margin:0;color:#61d4ff}p{color:#b8c8df}label{display:block;margin:17px 0 7px}input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;border:1px solid #38516f;font:inherit}button{margin-top:24px;background:#61d4ff;color:#07111c;font-weight:800;border:0;cursor:pointer}.result{margin-top:18px;padding:14px;background:#152b46;border-radius:10px}.hidden{display:none}</style></head><body><main class="card"><h1>WaitList VIP</h1><p>Únete a la lista de espera.</p><form id="form"><label>Nombre<input name="name" required maxlength="60" autocomplete="name"></label><label>Teléfono (opcional)<input name="phone" maxlength="30" autocomplete="tel"></label><label>Personas<select name="partySize"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button>Unirme a la lista</button></form><div id="result" class="result hidden"></div></main><script>const f=document.querySelector('#form'),r=document.querySelector('#result');f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));const x=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await x.json();r.classList.remove('hidden');r.textContent=x.ok?`¡Listo, ${d.entry.name}! Tu posición es #${d.position}.`:(d.error||'Intenta de nuevo.');if(x.ok)f.reset()}</script></body></html>
