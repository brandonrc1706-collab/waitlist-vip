<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WandaBarber</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#f4f8ff;font:16px system-ui;display:grid;place-items:center}.card{width:min(760px,92vw);background:#101d31;border:1px solid #263f5f;border-radius:24px;padding:32px;box-shadow:0 18px 60px #0006}h1,h2{margin:0 0 12px;color:#66d8ff;text-align:center}p{color:#b8c8df;text-align:center;line-height:1.5}.qr{text-align:center}.qr img{width:min(310px,78vw);height:min(310px,78vw);background:#fff;border-radius:18px;padding:12px;margin:12px}.hidden{display:none}label{display:block;margin:14px 0 6px;font-weight:700}input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #3c5473;background:#0b1728;color:#f4f8ff;font:inherit}button{cursor:pointer;border:0;background:#61d4ff;color:#06111f;font-weight:900;margin-top:22px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{margin:0;background:#152b46;color:#dcecff}.slot.busy{background:#30202a;color:#a9a9b0;text-decoration:line-through;cursor:not-allowed}.slot.selected{outline:3px solid #61d4ff;background:#195877}.price{margin:8px 0;color:#72e1a2;font-weight:800;text-align:left}.result{margin-top:18px;padding:16px;border-radius:12px;background:#123452}.note{font-size:.9rem}@media(max-width:540px){.card{padding:25px}.slots{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="card"><section id="qrPage" class="qr"><h1>WandaBarber</h1><h2>Registro por QR</h2><p>Escanea el código para reservar tu cita.</p><img id="qr" alt="Código QR para reservar en WandaBarber"><p class="note">Abre este enlace para mostrar el QR o imprimirlo.</p></section><section id="bookingPage" class="hidden"><h1>WandaBarber</h1><h2>Reserva tu corte</h2><p>Elige una fecha, hora disponible y servicio.</p><form id="booking"><label>Nombre<input name="name" required maxlength="60" autocomplete="name"></label><label>Teléfono<input name="phone" required maxlength="30" autocomplete="tel"></label><label>Fecha<input id="date" name="date" type="date" required></label><label>Hora disponible</label><div id="slots" class="slots"></div><input id="time" name="time" type="hidden" required><label>Corte o servicio<select id="service" name="serviceId" required></select></label><div id="price" class="price"></div><button>Confirmar mi reserva</button></form><div id="result" class="result hidden"></div></section></main><script>const $=s=>document.querySelector(s),register=new URLSearchParams(location.search).has('reservar');const reserveUrl=location.origin+location.pathname+'?reservar=1';$('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=340x340&data='+encodeURIComponent(reserveUrl);if(register){$('#qrPage').classList.add('hidden');$('#bookingPage').classList.remove('hidden');const date=$('#date'),slots=$('#slots'),time=$('#time'),service=$('#service'),price=$('#price'),result=$('#result');let services=[];date.min=new Date().toISOString().slice(0,10);date.value=date.min;function show(msg,ok=false){result.classList.remove('hidden');result.textContent=msg;result.style.background=ok?'#123f35':'#532936'}function info(){const s=services.find(x=>x.id===service.value);price.textContent=s?`${s.name} · $${s.price} · ${s.minutes} min`:''}async function load(){time.value='';slots.textContent='Cargando horarios...';const r=await fetch('/api/availability?date='+date.value),d=await r.json();if(!r.ok)return slots.textContent=d.error;slots.innerHTML='';d.hours.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x.time;b.className='slot'+(x.available?'':' busy');b.disabled=!x.available;b.onclick=()=>{document.querySelectorAll('.slot').forEach(e=>e.classList.remove('selected'));b.classList.add('selected');time.value=x.time};slots.append(b)})}async function init(){const d=await (await fetch('/api/services')).json();services=d.services;service.innerHTML=services.map(s=>`<option value="${s.id}">${s.name} — $${s.price}</option>`).join('');info();load()}date.onchange=load;service.onchange=info;$('#booking').onsubmit=async e=>{e.preventDefault();if(!time.value)return show('Escoge una hora disponible.');const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),d=await r.json();if(!r.ok)return show(d.error);show(`¡Reserva confirmada! ${d.booking.name}, te esperamos el ${d.booking.date} a las ${d.booking.time}. Total: $${d.booking.price}.`,true);e.target.reset();date.value=date.min;load()};init()}</script></body></html>
