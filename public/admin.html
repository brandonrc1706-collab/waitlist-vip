<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración de reservas</title><style>body{margin:0;background:#07111f;color:#f4f8ff;font:16px system-ui;padding:28px;max-width:1050px;margin:auto}h1{color:#66d8ff}.card,.booking{background:#101d31;border:1px solid #263f5f;padding:18px;border-radius:14px;margin:14px 0}input,button{padding:11px;border-radius:9px;border:1px solid #3c5473;font:inherit}button{cursor:pointer;background:#61d4ff;color:#06111f;font-weight:800}.danger{background:#ef8192}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#152b46;padding:14px;border-radius:10px;min-width:120px}.booking{display:flex;justify-content:space-between;align-items:center;gap:14px}.actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none}@media(max-width:640px){.booking{display:block}.actions{margin-top:12px}}</style></head><body><h1>Reservas VIP</h1><section id="login" class="card"><p>Ingresa la contraseña de administración.</p><input id="password" type="password" placeholder="Contraseña"><button id="enter">Entrar</button><p id="error"></p></section><main id="app" class="hidden"><section id="stats" class="stats"></section><section id="list"></section></main><script>const $=s=>document.querySelector(s),login=$('#login'),app=$('#app'),error=$('#error');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const r=await fetch('/api/admin/bookings');if(!r.ok)return;const d=await r.json();$('#stats').innerHTML=`<div class="stat"><b>${d.summary.total}</b><br>Reservas activas</div><div class="stat"><b>${d.summary.today}</b><br>Para hoy</div><div class="stat"><b>${d.summary.completed}</b><br>Completadas</div>`;$('#list').innerHTML=d.bookings.map(b=>`<article class="booking"><div><b>${esc(b.date)} · ${esc(b.time)}</b><br>${esc(b.name)} · ${esc(b.phone)}<br><small>${esc(b.service)} · $${b.price} · ${esc(b.status)}</small></div><div class="actions">${b.status==='confirmed'?`<button onclick="status('${b.id}','completed')">Completar</button>`:''}${b.status!=='cancelled'?`<button class="danger" onclick="status('${b.id}','cancelled')">Cancelar</button>`:''}</div></article>`).join('')||'<p class="card">Aún no hay reservas.</p>'}async function status(id,value){await fetch('/api/admin/bookings/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:value})});load()}$('#enter').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});if(!r.ok){error.textContent='Contraseña incorrecta.';return}login.classList.add('hidden');app.classList.remove('hidden');load();setInterval(load,5000)}</script></body></html>
